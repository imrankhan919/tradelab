services:
  mongo:
    image: mongo:8
    container_name: tradelab-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) {
            ↪ rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
  redis:
    image: redis:7-alpine
    container_name: tradelab-redis
    ports:
      - "6379:6379"
volumes:
  mongo-data:
